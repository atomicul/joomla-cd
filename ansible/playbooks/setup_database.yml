---
- name: Set up MariaDB database for Joomla on Amazon Linux 2023
  hosts: role_db
  become: true

  handlers:
    - name: Restart MariaDB
      ansible.builtin.service:
        name: mariadb
        state: restarted

  tasks:
    - name: Install MariaDB server, pip, and required dependencies
      ansible.builtin.dnf:
        name:
          - mariadb105-server
          - python3-pip
        state: present
        update_cache: true

    - name: Install PyMySQL (required by Ansible mysql modules)
      ansible.builtin.pip:
        name: PyMySQL
        executable: pip3

    - name: Configure MariaDB to listen on all interfaces
      ansible.builtin.copy:
        dest: /etc/my.cnf.d/99-bind-address.cnf
        content: |
          [mysqld]
          bind-address = 0.0.0.0
        owner: root
        group: root
        mode: '0644'
      notify: Restart MariaDB

    - name: Ensure MariaDB is running and enabled on boot
      ansible.builtin.service:
        name: mariadb
        state: started
        enabled: true

    - name: Create the Joomla MariaDB database
      ansible.mariadb.mariadb_db:
        name: "{{ db_name }}"
        state: present
        login_unix_socket: /var/lib/mysql/mysql.sock

    - name: Create the Joomla database user and grant permissions
      ansible.mariadb.mariadb_user:
        name: "{{ db_user }}"
        password: "{{ db_password }}"
        priv: "{{ db_name }}.*:ALL"
        host: "%"
        state: present
        login_unix_socket: /var/lib/mysql/mysql.sock

    - name: Ensure SELinux allows MariaDB to accept connections on any interface (if enforcing)
      ansible.posix.seboolean:
        name: mysql_connect_any
        state: true
        persistent: true
      failed_when: false
